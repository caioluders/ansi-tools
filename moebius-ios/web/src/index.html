<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover + user-scalable=no: we handle zoom ourselves; avoids
         the page itself zooming and fights with the canvas pinch gesture. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/document.css">
    <link rel="stylesheet" href="css/toolbar.css">
    <link rel="stylesheet" href="mobile.css">
    <title>Untitled</title>
    <!-- defer: runs after the DOM is parsed but before DOMContentLoaded, so the
         renderer's DOMContentLoaded listeners (mouse, keyboard, ui) still fire. -->
    <script defer src="moebius.bundle.js"></script>
</head>
<body class="dark">
    <div id="sidebar">
        <div id="current_colors">
            <canvas id="bg" width="24" height="24"></canvas>
            <canvas id="fg" width="24" height="24"></canvas>
        </div>
        <div id="swatches"></div>
        <div class="seperator"></div>
        <div class="tool" id="select_mode"></div>
        <div class="tool" id="brush_mode"></div>
        <div class="tool" id="shifter_mode"></div>
        <div class="tool" id="line_mode"></div>
        <div class="tool" id="rectangle_mode"></div>
        <div class="tool" id="ellipse_mode"></div>
        <div class="tool" id="fill_mode"></div>
        <div class="seperator"></div>
        <div class="tool" id="sample_mode"></div>
    </div>
    <div id="preview">
        <div id="view_frame" class="hidden"></div>
    </div>
    <div id="toolbar">
        <div class="panel hidden" id="select_panel">
            <div>
                <div><span id="f1_pref" class="fkey_pref_text">F1</span>: <canvas id="f1" width="8" height="16"></canvas></div>
                <div><span id="f2_pref" class="fkey_pref_text">F2</span>: <canvas id="f2" width="8" height="16"></canvas></div>
                <div><span id="f3_pref" class="fkey_pref_text">F3</span>: <canvas id="f3" width="8" height="16"></canvas></div>
                <div><span id="f4_pref" class="fkey_pref_text">F4</span>: <canvas id="f4" width="8" height="16"></canvas></div>
                <div><span id="f5_pref" class="fkey_pref_text">F5</span>: <canvas id="f5" width="8" height="16"></canvas></div>
                <div><span id="f6_pref" class="fkey_pref_text">F6</span>: <canvas id="f6" width="8" height="16"></canvas></div>
                <div><span id="f7_pref" class="fkey_pref_text">F7</span>: <canvas id="f7" width="8" height="16"></canvas></div>
                <div><span id="f8_pref" class="fkey_pref_text">F8</span>: <canvas id="f8" width="8" height="16"></canvas></div>
                <div><span id="f9_pref" class="fkey_pref_text">F9</span>: <canvas id="f9" width="8" height="16"></canvas></div>
                <div><span id="f10_pref" class="fkey_pref_text">F10</span>: <canvas id="f10" width="8" height="16"></canvas></div>
                <div><span id="f11_pref" class="fkey_pref_text">F11</span>: <canvas id="f11" width="8" height="16"></canvas></div>
                <div><span id="f12_pref" class="fkey_pref_text">F12</span>: <canvas id="f12" width="8" height="16"></canvas></div>
                <div id="fkey_chooser">
                    <div id="fkey_chooser_left"></div><div id="fkey_chooser_num">0</div><div id="fkey_chooser_right"></div>
                </div>
            </div>
        </div>
        <div class="panel hidden" id="brush_panel">
            <div>
                <div class="button" id="half_block">Half Block</div>
                <div class="button" id="custom_block"><canvas id="custom_block_canvas" width="8" height="16"></canvas></div>
                <div class="button" id="shading_block">Shading</div>
                <div class="button" id="replace_color">Replace</div>
                <div class="button" id="blink">Blink</div>
                <div id="colorize_container">
                    <div class="button" id="colorize">Colorize</div>
                    <div class="button" id="colorize_fg">fg.</div>
                    <div class="button" id="colorize_bg">bg.</div>
                </div>
                <div id="brush_size_chooser">
                    <div id="brush_size_left"></div><div id="brush_size_num">0</div><div id="brush_size_right"></div>
                </div>
            </div>
        </div>
        <div class="panel hidden" id="sample_panel">
            <div>
                Code: <div id="code_value"></div>
                <canvas id="sample_block" width="8" height="16"></canvas>
                Foreground: <div id="fg_value"></div>
                <canvas id="sample_fg" width="32" height="32"></canvas>
                Background: <div id="bg_value"></div>
                <canvas id="sample_bg" width="32" height="32"></canvas>
            </div>
        </div>
    </div>
    <div id="viewport">
        <div id="canvas_container">
            <div id="ice_color_container"></div>
            <div id="blink_off_container"></div>
            <div id="blink_on_container"></div>
            <div id="editing_layer"></div>
            <div id="reference_image"></div>
            <div id="guide" class="hidden"></div>
            <div id="drawing_grid" class="hidden"></div>
        </div>
    </div>
    <div id="chat">
        <div id="chat_resizer"></div>
        <div id="user_list"></div>
        <div id="messages"></div>
        <input type="text" id="chat_input">
        <div id="messages"></div>
    </div>
    <div id="statusbar">
        <div id="left_info">
            <div id="use_9px_font_toggle">Letter Spacing <span id="use_9px_font">Off</span></div>
            <div id="ice_colors_toggle">iCE Colors <span id="ice_colors">Off</span></div>
        </div>
        <div id="mid_info">
            <div id="dimensions"><span id="columns">0</span> Column<span id="columns_s">s</span> × <span id="rows">0</span> Row<span id="rows_s">s</span></div>
        </div>
        <div id="right_info">
            <div id="font_name"></div>
            <div id="cursor_position">Ln <span id="cursor_y">0</span>, Col <span id="cursor_x">0</span></div>
            <div id="insert_mode"></div>
        </div>
    </div>
    <div id="zoom"></div>

    <!-- ===================== iOS touch input layer ===================== -->
    <!-- Hidden field used to summon and capture the iOS soft keyboard for
         literal CP437 text entry. Managed by touch_input.js. -->
    <textarea id="mobile_text_capture" autocapitalize="off" autocomplete="off"
        autocorrect="off" spellcheck="false" aria-hidden="true"></textarea>

    <!-- On-screen control bar: the keys a touch device can't otherwise send.
         Each [data-code] maps to a synthetic DOM KeyboardEvent; modifiers via
         data-ctrl/data-alt/data-shift. -->
    <div id="mobile_bar" class="hidden">
        <div class="mb_row mb_fkeys">
            <button class="mb_key" data-code="F1">F1</button>
            <button class="mb_key" data-code="F2">F2</button>
            <button class="mb_key" data-code="F3">F3</button>
            <button class="mb_key" data-code="F4">F4</button>
            <button class="mb_key" data-code="F5">F5</button>
            <button class="mb_key" data-code="F6">F6</button>
            <button class="mb_key" data-code="F7">F7</button>
            <button class="mb_key" data-code="F8">F8</button>
            <button class="mb_key" data-code="F9">F9</button>
            <button class="mb_key" data-code="F10">F10</button>
            <button class="mb_key" data-code="F11">F11</button>
            <button class="mb_key" data-code="F12">F12</button>
        </div>
        <div class="mb_row mb_controls">
            <button class="mb_key mb_wide" id="mb_keyboard">ABC ⌨</button>
            <button class="mb_key" data-code="Escape">Esc</button>
            <button class="mb_key" data-code="Tab">⇥</button>
            <button class="mb_key" data-code="Enter">⏎</button>
            <button class="mb_key" data-code="Backspace">⌫</button>
            <button class="mb_key" data-code="Delete">⌦</button>
            <button class="mb_key" id="mb_chars">CP437 ▦</button>
            <button class="mb_key mb_toggle" id="mb_secondary" title="Secondary (right-button) draw">2nd</button>
            <button class="mb_key" data-code="KeyZ" data-ctrl="true">↶</button>
            <button class="mb_key" data-code="KeyY" data-ctrl="true">↷</button>
            <div class="mb_dpad">
                <button class="mb_key mb_arrow mb_up" data-code="ArrowUp">▲</button>
                <button class="mb_key mb_arrow mb_left" data-code="ArrowLeft">◀</button>
                <button class="mb_key mb_arrow mb_down" data-code="ArrowDown">▼</button>
                <button class="mb_key mb_arrow mb_right" data-code="ArrowRight">▶</button>
            </div>
        </div>
    </div>

    <!-- CP437 character palette popover (built by touch_input.js). -->
    <div id="mobile_charmap" class="hidden"></div>
</body>
</html>
